<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deadline Wall</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Hanken+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a2fd6;--paper:#fcfcf7;--ink:#17133d;--quiz:#ff8fc7;--assign:#ffe14d;--hw:#6fe3b0;--soft:#e9e9f7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(rgba(255,255,255,.13) 1.5px,transparent 1.5px);background-size:22px 22px;color:var(--ink);font:400 16px/1.45 "Hanken Grotesk",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;color:#fff;margin-bottom:20px}
h1{font:400 clamp(2.4rem,7vw,4.4rem)/.9 "Bagel Fat One",system-ui,sans-serif;margin:0;transform:rotate(-1.5deg);text-shadow:4px 4px 0 var(--ink)}
header p{margin:6px 0 0;max-width:34ch;opacity:.9}
.crsw{display:flex;gap:8px;align-items:center;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:6px 14px 6px 8px;box-shadow:3px 3px 0 var(--ink);font-weight:600;cursor:pointer}
.crsw i{width:34px;height:20px;border-radius:99px;background:var(--soft);border:2px solid var(--ink);position:relative;transition:.15s}
.crsw i:after{content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;background:var(--ink);transition:.15s}
.crsw.on i{background:var(--hw)}.crsw.on i:after{left:15px}
.grid{display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:16px;box-shadow:6px 6px 0 var(--ink);margin-bottom:20px}
.card:nth-child(even){border-radius:22px 8px 22px 8px}
h2{font:400 1.45rem/1 "Bagel Fat One",system-ui,sans-serif;margin:0 0 12px}
select,input,textarea{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:7px 9px;width:100%}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--bg);outline-offset:2px}
.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
label{font-size:.82rem;font-weight:600;display:block;margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:2px solid var(--ink);background:#fff;border-radius:99px;padding:4px 12px;font:600 .88rem inherit;font-family:inherit;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);color:#fff}
.hint{font-size:.85rem;opacity:.75;margin:8px 0 0}
.bar{height:16px;border:2px solid var(--ink);border-radius:99px;background:var(--soft);overflow:hidden}
.bar b{display:block;height:100%;background:var(--hw);border-right:2px solid var(--ink);transition:width .3s}
.up{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:2px dashed var(--ink)}
.up:first-of-type{border-top:0}
.dot{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.up small{display:block;opacity:.75}
.up strong{margin-left:auto;white-space:nowrap;font-weight:800}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.nav h2{margin:0 auto 0 0;font-size:1.9rem}
.btn{border:2px solid var(--ink);background:var(--assign);border-radius:10px;padding:7px 14px;font:800 .95rem inherit;font-family:inherit;color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.dow,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow span{text-align:center;font-weight:800;font-size:.85rem;padding-bottom:4px}
.day{min-height:92px;text-align:left;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:4px;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day b{font:400 1.05rem/1 "Bagel Fat One",sans-serif}
.day.e{visibility:hidden}
.day.t{background:var(--assign)}
.day.s{outline:4px solid var(--bg);outline-offset:1px}
.p{font-style:normal;font-size:.72rem;font-weight:600;border:1.5px solid var(--ink);border-radius:5px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day em{font-size:.72rem;font-weight:800;font-style:normal}
.quiz{background:var(--quiz)}.assign{background:var(--assign)}.hw{background:var(--hw)}
.day.t .assign{background:#fff}
.x{text-decoration:line-through;opacity:.45}
@media(max-width:600px){.day{min-height:58px}.p{font-size:0;height:9px;padding:0}.day em{display:none}}
.tix{display:flex;margin-bottom:12px;border:2px solid var(--ink);border-radius:10px;background:#fff;position:relative}
.tix .stub{width:14px;flex:none;border-right:2px dashed var(--ink);border-radius:8px 0 0 8px}
.tix .body{padding:10px 12px;flex:1;min-width:0}
.tix h3{margin:0;font-size:1.05rem}
.tix p{margin:2px 0 0;font-size:.88rem}
.tix.done h3{text-decoration:line-through;opacity:.5}
.tix.done:after{content:"done";position:absolute;right:56px;top:50%;transform:translateY(-50%) rotate(-9deg);font:400 1.5rem "Bagel Fat One",sans-serif;color:#0a8a55;border:3px solid #0a8a55;border-radius:8px;padding:0 8px;opacity:.85;pointer-events:none}
.tick{flex:none;align-self:center;margin:0 12px;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:1.1rem;cursor:pointer;color:var(--ink)}
.done .tick{background:var(--hw)}
.del{background:none;border:0;font:600 .8rem inherit;font-family:inherit;text-decoration:underline;cursor:pointer;padding:0;margin-top:4px;color:var(--ink)}
.empty{padding:14px;border:2px dashed var(--ink);border-radius:10px;margin-bottom:12px}
.crform{border-top:2px solid var(--ink);padding-top:14px;margin-top:6px;display:grid;gap:8px}
.crform .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><div class="wrap">
<header><div><h1>Deadline Wall</h1><p>Every quiz, assignment and homework for your section, on one wall.</p></div>
<button class="crsw" id="crsw" data-act="cr" aria-pressed="false"><i></i>CR / GR mode</button></header>
<div class="grid">
<aside>
 <section class="card"><h2>My section</h2>
  <div class="row3">
   <div><label for="f-dept">Department</label><select id="f-dept" data-f="dept"></select></div>
   <div><label for="f-sem">Sem</label><select id="f-sem" data-f="sem"></select></div>
   <div><label for="f-sec">Sec</label><select id="f-sec" data-f="sec"></select></div>
  </div></section>
 <section class="card"><h2>My courses</h2><div class="chips" id="chips"></div>
  <p class="hint">Tap a course to hide or show it on your wall.</p></section>
 <section class="card"><h2>Progress</h2><div class="bar"><b id="bar"></b></div><p class="hint" id="prog"></p></section>
 <section class="card"><h2>Coming up</h2><div id="up"></div></section>
</aside>
<main>
 <section class="card"><div class="nav"><h2 id="mt"></h2>
  <button class="btn" data-act="prev" aria-label="Previous month">&lt;</button>
  <button class="btn" data-act="now">Today</button>
  <button class="btn" data-act="next" aria-label="Next month">&gt;</button></div>
  <div class="dow"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
  <div class="cal" id="cal"></div></section>
 <section class="card"><h2 id="dh"></h2><div id="dl"></div><div id="cr"></div></section>
</main></div></div>
<script>
const $=s=>document.querySelector(s),P=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+P(d.getMonth()+1)+'-'+P(d.getDate());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=iso(new Date()),off=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const TYPES={quiz:'Quiz',assign:'Assignment',hw:'Homework'};
const DEPTS=['CS','SE','EE','BBA','Maths'],SEMS=[1,2,3,4,5,6,7,8],SECS=['A','B','C','D','E'];

/* ---- DATA LAYER: the only place that touches storage. ----
   Today it uses this browser's localStorage (demo).
   To launch for real, replace these 4 functions with Firebase calls (see the guide). */
const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}};
const put=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const getTasks=()=>load('dw_tasks',seed());      // shared data: written by CR/GR
const saveTasks=t=>put('dw_tasks',t);
const getMine=()=>load('dw_me',{dept:'CS',sem:3,sec:'A',hidden:[],done:{},cr:false}); // personal data
const saveMine=m=>put('dw_me',m);
/* ------------------------------------------------------------ */

function seed(){const b={dept:'CS',sem:3,sec:'A'};return [
 {id:'s1',...b,course:'Data Structures',type:'quiz',title:'Quiz 2: linked lists',date:off(2),note:'Chapters 3 and 4'},
 {id:'s2',...b,course:'Discrete Math',type:'assign',title:'Assignment 3: rules of inference',date:off(4),note:'Submit on the portal'},
 {id:'s3',...b,course:'OOP',type:'assign',title:'Assignment 1: class design',date:off(6),note:'Hand-drawn UML plus code'},
 {id:'s4',...b,course:'Expository Writing',type:'hw',title:'Poster: anatomy of an essay',date:off(9),note:'PDF only'},
 {id:'s5',...b,course:'Data Structures',type:'hw',title:'Lab worksheet 5',date:off(9),note:''},
 {id:'s6',...b,course:'Discrete Math',type:'quiz',title:'Quiz 3',date:off(15),note:'Sections 1.4 to 1.6'}]}

let tasks=getTasks(),me=getMine(),view={m:today.slice(0,7),sel:today};
const scoped=()=>tasks.filter(t=>t.dept==me.dept&&t.sem==me.sem&&t.sec==me.sec);
const shown=()=>scoped().filter(t=>!me.hidden.includes(t.course));
const fmt=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
const opts=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');

function render(){
 $('#f-dept').innerHTML=opts(DEPTS,me.dept);$('#f-sem').innerHTML=opts(SEMS,me.sem);$('#f-sec').innerHTML=opts(SECS,me.sec);
 $('#crsw').classList.toggle('on',me.cr);$('#crsw').setAttribute('aria-pressed',me.cr);
 const courses=[...new Set(scoped().map(t=>t.course))];
 $('#chips').innerHTML=courses.length?courses.map(c=>`<button class="chip ${me.hidden.includes(c)?'':'on'}" data-act="course" data-c="${esc(c)}">${esc(c)}</button>`).join(''):'<p class="hint">No courses yet. Your CR or GR will add them.</p>';
 const v=shown(),dn=v.filter(t=>me.done[t.id]).length;
 $('#bar').style.width=(v.length?dn/v.length*100:0)+'%';
 $('#prog').textContent=v.length?`${dn} of ${v.length} tasks done`:'Nothing to track yet.';
 const up=v.filter(t=>!me.done[t.id]&&t.date>=today).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
 $('#up').innerHTML=up.length?up.map(t=>{const n=Math.round((new Date(t.date)-new Date(today))/864e5);
  return `<div class="up"><span class="dot ${t.type}"></span><div>${esc(t.title)}<small>${esc(t.course)}</small></div><strong>${n==0?'Today':n==1?'Tomorrow':n+' days'}</strong></div>`}).join(''):'<p class="hint">You are all caught up.</p>';
 const [y,mo]=view.m.split('-').map(Number),lead=(new Date(y,mo-1,1).getDay()+6)%7,dim=new Date(y,mo,0).getDate();
 $('#mt').textContent=new Date(y,mo-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
 let h='<span class="day e"></span>'.repeat(lead);
 for(let d=1;d<=dim;d++){const ds=`${view.m}-${P(d)}`,ts=v.filter(t=>t.date==ds);
  h+=`<button class="day ${ds==today?'t':''} ${ds==view.sel?'s':''}" data-act="sel" data-d="${ds}"><b>${d}</b>`+
   ts.slice(0,2).map(t=>`<i class="p ${t.type} ${me.done[t.id]?'x':''}">${esc(t.course)}</i>`).join('')+(ts.length>2?`<em>+${ts.length-2} more</em>`:'')+'</button>'}
 $('#cal').innerHTML=h;
 $('#dh').textContent=fmt(view.sel);
 const day=v.filter(t=>t.date==view.sel);
 $('#dl').innerHTML=day.length?day.map(t=>`<div class="tix ${me.done[t.id]?'done':''}"><div class="stub ${t.type}"></div><div class="body"><h3>${esc(t.title)}</h3><p>${esc(t.course)}, ${TYPES[t.type]}${t.note?'. '+esc(t.note):''}</p>${me.cr?`<button class="del" data-act="del" data-id="${t.id}">Remove from section</button>`:''}</div><button class="tick" data-act="done" data-id="${t.id}" aria-label="Mark done">${me.done[t.id]?'✓':''}</button></div>`).join(''):'<div class="empty">Nothing due on this day.</div>';
 $('#cr').innerHTML=me.cr?`<div class="crform"><h2>Add to ${me.dept} sem ${me.sem} section ${me.sec}</h2>
  <div class="two"><div><label for="n-c">Course</label><input id="n-c" list="cl" placeholder="e.g. OOP"><datalist id="cl">${courses.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
  <div><label for="n-t">Type</label><select id="n-t">${Object.entries(TYPES).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div></div>
  <div><label for="n-n">Title</label><input id="n-n" placeholder="Quiz 4: stacks and queues"></div>
  <div class="two"><div><label for="n-d">Due date</label><input id="n-d" type="date" value="${view.sel}"></div>
  <div><label for="n-o">Note</label><input id="n-o" placeholder="Optional"></div></div>
  <button class="btn" data-act="add">Add deadline</button></div>`:'';
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a=='sel'){view.sel=b.dataset.d}
 else if(a=='prev'||a=='next'){const [y,m]=view.m.split('-').map(Number),d=new Date(y,m-1+(a=='next'?1:-1),1);view.m=iso(d).slice(0,7)}
 else if(a=='now'){view={m:today.slice(0,7),sel:today}}
 else if(a=='course'){const c=b.dataset.c;me.hidden=me.hidden.includes(c)?me.hidden.filter(x=>x!=c):[...me.hidden,c];saveMine(me)}
 else if(a=='done'){const i=b.dataset.id;me.done[i]?delete me.done[i]:me.done[i]=1;saveMine(me)}
 else if(a=='cr'){me.cr=!me.cr;saveMine(me)}
 else if(a=='del'){if(!confirm('Remove this deadline for the whole section?'))return;tasks=tasks.filter(t=>t.id!=b.dataset.id);saveTasks(tasks)}
 else if(a=='add'){const c=$('#n-c').value.trim(),n=$('#n-n').value.trim(),d=$('#n-d').value;
  if(!c||!n||!d){alert('Add a course, a title and a due date.');return}
  tasks.push({id:'t'+Date.now(),dept:me.dept,sem:me.sem,sec:me.sec,course:c,type:$('#n-t').value,title:n,date:d,note:$('#n-o').value.trim()});
  saveTasks(tasks);view.sel=d;view.m=d.slice(0,7)}
 render()});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;me[f]=f=='sem'?+e.target.value:e.target.value;saveMine(me);render()});
render();
</script></body></html>
